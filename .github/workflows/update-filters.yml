name: Update filter metadata

on:
  schedule:
    # First day of each month at 03:00 UTC.
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update filter metadata
        run: python scripts/update_filters_meta.py

      - name: Commit changes
        run: |
          if git diff --quiet -- filters-meta.js dns-filters-meta.js; then
            echo "Filter metadata is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add filters-meta.js dns-filters-meta.js
          git commit -m "Update filter metadata"
          git push
